[build]
builder = "nixpacks"
buildCommand = "bun install && bun run --cwd packages/backend build"
nixpacksConfigPath = "nixpacks.toml"

[deploy]
startCommand = "bun run --cwd packages/backend start"
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[service]
name = "intercambio-backend"
