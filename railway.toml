[build]
builder = "nixpacks"
buildCommand = "curl -fsSL https://bun.sh/install | bash && ~/.bun/bin/bun install && ~/.bun/bin/bun run --cwd packages/backend build"

[deploy]
startCommand = "~/.bun/bin/bun run --cwd packages/backend start"
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[service]
name = "intercambio-backend"
